version: 2
updates:
  # npm dependencies across every package in the monorepo. `directories`
  # (glob) covers each package's own package.json/lock without one entry
  # per package. Grouped so a week's bumps land as a few PRs, not dozens.
  - package-ecosystem: "npm"
    directories:
      - "/packages/*"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # @types/vscode must not outrun usrcp-vscode's engines.vscode floor:
    # `vsce package` refuses to build the extension when it does.
    # Raise engines.vscode and this pin together, by hand.
    ignore:
      - dependency-name: "@types/vscode"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      dev-and-runtime:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # One PR for a vitest major across every package, instead of one
      # PR per package that each take a slot under the PR limit.
      vitest-major:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"

  # GitHub Actions used by the workflows (checkout, setup-node, etc.).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
