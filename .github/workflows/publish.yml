name: publish

# Coordinated npm release of the USRCP packages, driven by
# scripts/release/publish.mjs. Triggered by pushing a version tag
# (e.g. v0.1.8) or manually via the Actions tab.
#
# Auth model — hybrid, OIDC-preferred:
#
#   - Trusted Publishing (OIDC): once a package has a trusted publisher
#     configured on npm (Package settings → Publishing access → GitHub
#     Actions: repo frank-bot07/usrcp, workflow publish.yml), npm CLI
#     >= 11.5.1 authenticates via the `id-token` minted below — no token,
#     and a signed provenance attestation is attached automatically.
#   - Token fallback: for the FIRST publish (trusted publishing can only
#     be configured on a package that already exists) and for any package
#     not yet OIDC-configured, npm falls back to NODE_AUTH_TOKEN from the
#     NPM_TOKEN secret.
#
# So this workflow works today via the token, and transparently upgrades
# to token-free OIDC + provenance per package as you configure each one
# on npm — no edit to this file required. See docs/RELEASING.md for the
# per-package npm-side setup. The build + pack dry run runs regardless, so
# a tag always gets a tarball-level sanity check even before any auth.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      execute:
        description: 'Actually publish to npm (false = dry-run pack only)'
        type: boolean
        default: false

jobs:
  # Test gate — a tag must NOT publish a broken-but-compiles commit. The
  # dry-run pack below only builds + packs; it never runs a single test. This
  # job runs the core protocol suites (usrcp-core crypto/ledger/rotation,
  # usrcp-local server, usrcp-stream) first, and every publish job depends on
  # it. Mirrors test.yml's install loop so sibling builds resolve.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Upgrade npm
        run: npm install -g npm@11.5.1
      - name: Install deps in all cross-platform packages
        run: |
          for pkg in packages/*/; do
            name=$(basename "$pkg")
            if [ "$name" = "usrcp-imessage" ] || [ "$name" = "usrcp-hermes" ]; then
              continue
            fi
            if [ -f "$pkg/package.json" ]; then
              echo "::group::npm ci in $pkg"
              (cd "$pkg" && npm ci)
              echo "::endgroup::"
            fi
          done
      - name: Test core protocol suites
        run: |
          for pkg in usrcp-core usrcp-local usrcp-stream; do
            echo "::group::test $pkg"
            (cd "packages/$pkg" && npm test)
            echo "::endgroup::"
          done

  # The 13 cross-platform packages publish from Linux. usrcp-imessage is
  # darwin-only (`"os": ["darwin"]`) — it can't even `npm ci` on Linux
  # (EBADPLATFORM), so it's excluded here and published from the macOS job
  # below (mirrors the split in test.yml).
  publish:
    needs: test
    runs-on: ubuntu-latest
    # id-token: write lets npm mint the OIDC token for Trusted Publishing
    # and provenance. contents: read is the least-privilege default for
    # checkout. Without id-token:write, npm silently uses the token only.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Pinned to 11.5.1 (not @latest): satisfies Trusted Publishing (>=11.5.1)
      # and the EBADPLATFORM fix (11+), while avoiding npm's newer allowScripts
      # default, which blocks better-sqlite3's native build + our postinstall
      # rebuild → no .node binary → every ledger test fails. Unpinned @latest is
      # a non-reproducible CI input; it broke the build silently between two
      # releases. Revisit only to adopt allowScripts deliberately.
      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      # Each publishable package is built from its own dir; the release
      # script calls `npm run build` per package (prebuild handles the
      # sibling chain), but it needs deps installed first. Install the
      # tier-1/2 packages plus every cross-platform adapter so tsc +
      # sibling builds resolve. (usrcp-imessage omitted — darwin-only.)
      - name: Install deps in cross-platform packages
        run: |
          for pkg in usrcp-core usrcp-local usrcp-adapter-kit usrcp-stream \
                     usrcp-obsidian usrcp-linear usrcp-github usrcp-gmail \
                     usrcp-google-calendar usrcp-discord usrcp-telegram \
                     usrcp-slack usrcp-claude-code usrcp-extension; do
            echo "::group::npm ci in $pkg"
            (cd "packages/$pkg" && npm ci)
            echo "::endgroup::"
          done

      # Always run the dry-run pack first — builds everything, rewrites
      # deps, packs each tarball, restores. Catches build/metadata errors
      # before any publish.
      - name: Dry-run pack (excl. darwin-only imessage)
        run: node scripts/release/publish.mjs --exclude=usrcp-imessage

      # Publish only on a tag push, or when the manual dispatch sets
      # execute=true. The release script restores package.json regardless.
      #
      # NODE_AUTH_TOKEN is the fallback; when a package has Trusted
      # Publishing configured, npm prefers the OIDC id-token (from the
      # job permissions above) and ignores the token. Keeping both means
      # the first publish works before any OIDC config exists, and each
      # package upgrades to OIDC the moment its trusted publisher is set.
      - name: Publish to npm (excl. darwin-only imessage)
        if: github.event_name == 'push' || inputs.execute == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release/publish.mjs --execute --exclude=usrcp-imessage

  # usrcp-imessage is darwin-only, so it builds + publishes from macOS.
  # Runs after the Linux job so its ^0.1.8 deps (usrcp-local / -stream /
  # -adapter-kit) already exist on npm by the time anyone installs it.
  publish-imessage:
    needs: publish
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm
        run: npm install -g npm@11.5.1
      # imessage's prebuild builds usrcp-adapter-kit + usrcp-stream, which build
      # usrcp-core; install the whole chain so each has its toolchain.
      - name: Install deps (imessage + sibling build chain)
        run: |
          for pkg in usrcp-core usrcp-local usrcp-adapter-kit usrcp-stream usrcp-imessage; do
            echo "::group::npm ci in $pkg"
            (cd "packages/$pkg" && npm ci)
            echo "::endgroup::"
          done
      - name: Dry-run pack (imessage only)
        run: node scripts/release/publish.mjs --only=usrcp-imessage
      - name: Publish usrcp-imessage to npm
        if: github.event_name == 'push' || inputs.execute == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release/publish.mjs --execute --only=usrcp-imessage
