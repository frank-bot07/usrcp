name: tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/dependabot.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/dependabot.yml'
  # Nightly full matrix (all Node versions + macOS) so the cross-version and
  # darwin coverage still runs daily even though PRs no longer pay for it.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# CI cost model (why the matrix below is shaped the way it is):
#   - PRs run ONE Node version (24) on Linux only.
#   - Pushes to main, the nightly schedule, and manual dispatch run the full
#     22/24/26 matrix and the macOS jobs.
#   - GitHub bills macOS at 10x Linux and every job at a 1-minute minimum, so a
#     57-job matrix on every PR push was ~65-75 billed minutes per run. This
#     shape cuts a PR run to ~17 Linux jobs and keeps full coverage on main.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-platform packages run on Linux. usrcp-imessage is darwin-only
  # (`"os": ["darwin"]` in package.json), and npm 11 enforces that on
  # the package itself, not just on it as a dependency — so we skip it
  # here and run it on the macos job below.
  node-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PRs: Node 24 only. main / nightly / dispatch: 22, 24, 26.
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["24"]') || fromJSON('["22", "24", "26"]') }}
        package:
          - usrcp-core
          - usrcp-adapter-kit
          - usrcp-claude-code
          - usrcp-cloud
          - usrcp-discord
          - usrcp-extension
          - usrcp-github
          - usrcp-gmail
          - usrcp-google-calendar
          - usrcp-linear
          - usrcp-local
          - usrcp-obsidian
          - usrcp-slack
          - usrcp-stream
          - usrcp-telegram
          - usrcp-vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            packages/usrcp-core/package-lock.json
            packages/usrcp-adapter-kit/package-lock.json
            packages/usrcp-claude-code/package-lock.json
            packages/usrcp-cloud/package-lock.json
            packages/usrcp-discord/package-lock.json
            packages/usrcp-extension/package-lock.json
            packages/usrcp-github/package-lock.json
            packages/usrcp-gmail/package-lock.json
            packages/usrcp-google-calendar/package-lock.json
            packages/usrcp-linear/package-lock.json
            packages/usrcp-local/package-lock.json
            packages/usrcp-obsidian/package-lock.json
            packages/usrcp-slack/package-lock.json
            packages/usrcp-stream/package-lock.json
            packages/usrcp-telegram/package-lock.json
      # Need npm 11+ so optionalDependencies with platform constraints
      # (e.g. esbuild's @esbuild/openharmony-arm64) get filtered out
      # rather than failing with EBADPLATFORM on linux-x64.
      - name: Upgrade npm
        run: npm install -g npm@11.5.1
      # Several packages run `npm run build` against sibling packages in
      # their pretest hook (most adapters need usrcp-local; usrcp-local
      # needs usrcp-discord and usrcp-telegram). Install deps in every
      # cross-platform package so those sibling builds resolve their tsc.
      - name: Install deps in all cross-platform packages
        run: |
          for pkg in packages/*/; do
            name=$(basename "$pkg")
            if [ "$name" = "usrcp-imessage" ] || [ "$name" = "usrcp-hermes" ]; then
              continue
            fi
            if [ -f "$pkg/package.json" ]; then
              echo "::group::npm ci in $pkg"
              (cd "$pkg" && npm ci)
              echo "::endgroup::"
            fi
          done
      # Build the package's OWN source. The adapters' `pretest` only builds
      # sibling deps (usrcp-adapter-kit / usrcp-core), and their vitest suites
      # don't import the built entrypoint — so a broken adapter entrypoint
      # (e.g. an ESM-only major that a CJS adapter can't require) compiled
      # clean-through CI while `npm run build` at release time failed. This
      # step type-checks each package's own source so that class fails at PR
      # time, not at the release pack.
      - name: Build ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: npm run build
      - name: Type-check ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: npm run lint --if-present
      - name: Test ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: npm test

  node-macos:
    # macOS bills at 10x; run it on main, nightly, and dispatch - not per PR push.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            packages/usrcp-adapter-kit/package-lock.json
            packages/usrcp-imessage/package-lock.json
            packages/usrcp-local/package-lock.json
            packages/usrcp-stream/package-lock.json
      - name: Upgrade npm
        run: npm install -g npm@11.5.1
      # usrcp-imessage's pretest builds usrcp-adapter-kit (which builds
      # usrcp-local) AND usrcp-stream. Install all four so those sibling
      # builds resolve their tsc.
      - name: Install deps
        run: |
          (cd packages/usrcp-core && npm ci)
          (cd packages/usrcp-local && npm ci)
          (cd packages/usrcp-adapter-kit && npm ci)
          (cd packages/usrcp-stream && npm ci)
          (cd packages/usrcp-imessage && npm ci)
      - name: Test usrcp-imessage
        working-directory: packages/usrcp-imessage
        run: npm test

  # End-to-end install smoke. usrcp-local is now BUILDLESS (node:sqlite, no
  # native better-sqlite3), so this job guards the property that matters since
  # that migration: `npm install` works on ANY npm — including npm 12+, whose
  # allowScripts default blocks native build scripts (the bug that crashed a
  # new user's first `usrcp init` with "Could not locate the bindings file").
  # It runs under npm@latest (the blocking version) and asserts:
  #   1. `npm ci` produces NO native binary (buildless)
  #   2. build + `npm link` (puts `usrcp` on PATH)
  #   3. `usrcp --help` — banner renders
  #   4. `usrcp init --dev` — full ledger init on node:sqlite end-to-end
  #   5. `usrcp serve --stdio` answers an MCP initialize + tools/list exchange
  # If a native dependency ever creeps back into the main install, step 1 fails.
  install-smoke:
    name: install-smoke (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # PRs: ubuntu / Node 24 only. main / nightly / dispatch: both OSes, all versions.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
        node-version: ${{ github.event_name == 'pull_request' && fromJSON('["24"]') || fromJSON('["22", "24", "26"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: packages/usrcp-local/package-lock.json
      # Deliberately npm@latest (not the pinned 11.5.1): the whole point of the
      # node:sqlite migration is that the main install no longer needs build
      # scripts, so it must work on the allowScripts-default npm.
      - name: Upgrade npm
        run: npm install -g npm@latest
      - name: Install usrcp-core deps (usrcp-local's prebuild compiles it)
        working-directory: packages/usrcp-core
        run: npm ci
      - name: npm ci
        working-directory: packages/usrcp-local
        run: npm ci
      - name: Verify production deps are buildless (no native module)
        working-directory: packages/usrcp-local
        run: |
          # A user's `npm install -g usrcp` installs PRODUCTION deps only. Dev
          # tooling (vitest/rolldown/fsevents) ships native .node files but is
          # never in the user's install, so check the production tree only.
          # better-sqlite3 is the native runtime dep the node:sqlite migration
          # removed; if it returns to production deps, this install stops being
          # buildless — fail.
          if npm ls --omit=dev --all 2>/dev/null | grep -qi 'better-sqlite3'; then
            echo "::error::better-sqlite3 is back in the production dependency tree — main install is no longer buildless"
            npm ls --omit=dev --all 2>/dev/null | grep -i 'better-sqlite3' || true
            exit 1
          fi
          echo "✓ buildless — no better-sqlite3 in the production dependency tree"
      - name: Build
        working-directory: packages/usrcp-local
        run: npm run build
      - name: Link binary
        working-directory: packages/usrcp-local
        run: npm link
      - name: usrcp --help
        run: usrcp --help
      - name: usrcp init --dev in isolated HOME
        run: |
          export HOME=$(mktemp -d "${RUNNER_TEMP:-/tmp}/usrcp-smoke-XXXXXX")
          echo "$HOME" > "${RUNNER_TEMP:-/tmp}/usrcp-smoke-home"
          echo "Using isolated HOME=$HOME"
          usrcp init --dev
          usrcp status
          echo "✓ init + status succeeded"
      - name: usrcp serve --stdio MCP smoke
        run: |
          export HOME=$(cat "${RUNNER_TEMP:-/tmp}/usrcp-smoke-home")
          node <<'NODE'
          const { spawn } = require("node:child_process");

          const child = spawn("usrcp", ["serve", "--stdio"], {
            env: process.env,
            stdio: ["pipe", "pipe", "pipe"],
          });

          let stdout = "";
          let stderr = "";
          child.stdout.on("data", (chunk) => { stdout += chunk.toString("utf8"); });
          child.stderr.on("data", (chunk) => { stderr += chunk.toString("utf8"); });

          function send(message) {
            child.stdin.write(`${JSON.stringify(message)}\n`);
          }

          function readMessage() {
            const index = stdout.indexOf("\n");
            if (index === -1) return null;
            const line = stdout.slice(0, index).replace(/\r$/, "");
            stdout = stdout.slice(index + 1);
            return JSON.parse(line);
          }

          async function waitFor(id, timeoutMs = 5000) {
            const deadline = Date.now() + timeoutMs;
            while (Date.now() < deadline) {
              const frame = readMessage();
              if (frame) {
                if (frame.id === id) return frame;
                continue;
              }
              await new Promise((resolve) => setTimeout(resolve, 25));
            }
            throw new Error(`timed out waiting for MCP response id=${id}; stderr=${stderr}`);
          }

          (async () => {
            send({
              jsonrpc: "2.0",
              id: 1,
              method: "initialize",
              params: {
                protocolVersion: "2024-11-05",
                capabilities: {},
                clientInfo: { name: "usrcp-ci-smoke", version: "0.0.0" },
              },
            });
            const init = await waitFor(1);
            if (init.error) throw new Error(`initialize failed: ${JSON.stringify(init.error)}`);

            send({ jsonrpc: "2.0", method: "notifications/initialized", params: {} });
            send({ jsonrpc: "2.0", id: 2, method: "tools/list", params: {} });
            const tools = await waitFor(2);
            if (tools.error) throw new Error(`tools/list failed: ${JSON.stringify(tools.error)}`);
            const names = tools.result?.tools?.map((tool) => tool.name) ?? [];
            if (!names.includes("usrcp_status")) {
              throw new Error(`usrcp_status missing from tools/list: ${names.join(", ")}`);
            }
            child.kill("SIGTERM");
            console.log(`✓ MCP stdio initialized; tools=${names.length}`);
          })().catch((err) => {
            child.kill("SIGTERM");
            console.error(err);
            process.exit(1);
          });
          NODE

  # Supply-chain gate across all Node lockfiles.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Upgrade npm
        run: npm install -g npm@11.5.1
      - name: npm audit (high + critical only)
        run: |
          for lock in packages/*/package-lock.json sdk/package-lock.json; do
            pkg=$(dirname "$lock")
            echo "::group::npm audit $pkg"
            (cd "$pkg" && npm audit --audit-level=high)
            echo "::endgroup::"
          done
      # Retain the explicit ip-address advisory regression guard.
      - name: ip-address advisory floor (all lockfiles)
        run: node scripts/check-ipaddress-floor.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install hermes (with dev extras)
        working-directory: packages/usrcp-hermes
        run: pip install -e '.[dev]'
      - name: Test usrcp-hermes
        working-directory: packages/usrcp-hermes
        run: pytest

  postgres-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
        working-directory: packages/usrcp-cloud
      - run: npm test
        working-directory: packages/usrcp-cloud
        env:
          USRCP_TEST_DATABASE_URL: postgres://postgres:ci-test-only@localhost:5432/postgres

  packed-minimum-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13.0'
      - run: npm ci --ignore-scripts
        working-directory: packages/usrcp-core
      - run: npm ci --ignore-scripts
        working-directory: packages/usrcp-local
      - run: npm run build
        working-directory: packages/usrcp-local
      - run: node scripts/verify-packed-install.mjs
