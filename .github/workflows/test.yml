name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross-platform packages run on Linux. usrcp-imessage is darwin-only
  # (`"os": ["darwin"]` in package.json), and npm 11 enforces that on
  # the package itself, not just on it as a dependency — so we skip it
  # here and run it on the macos job below.
  node-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
        package:
          - usrcp-claude-code
          - usrcp-cloud
          - usrcp-discord
          - usrcp-extension
          - usrcp-github
          - usrcp-gmail
          - usrcp-google-calendar
          - usrcp-linear
          - usrcp-local
          - usrcp-obsidian
          - usrcp-slack
          - usrcp-stream
          - usrcp-telegram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            packages/usrcp-claude-code/package-lock.json
            packages/usrcp-cloud/package-lock.json
            packages/usrcp-discord/package-lock.json
            packages/usrcp-extension/package-lock.json
            packages/usrcp-github/package-lock.json
            packages/usrcp-gmail/package-lock.json
            packages/usrcp-google-calendar/package-lock.json
            packages/usrcp-linear/package-lock.json
            packages/usrcp-local/package-lock.json
            packages/usrcp-obsidian/package-lock.json
            packages/usrcp-slack/package-lock.json
            packages/usrcp-stream/package-lock.json
            packages/usrcp-telegram/package-lock.json
      # Need npm 11+ so optionalDependencies with platform constraints
      # (e.g. esbuild's @esbuild/openharmony-arm64) get filtered out
      # rather than failing with EBADPLATFORM on linux-x64.
      - name: Upgrade npm
        run: npm install -g npm@latest
      # Several packages run `npm run build` against sibling packages in
      # their pretest hook (most adapters need usrcp-local; usrcp-local
      # needs usrcp-discord and usrcp-telegram). Install deps in every
      # cross-platform package so those sibling builds resolve their tsc.
      - name: Install deps in all cross-platform packages
        run: |
          for pkg in packages/*/; do
            name=$(basename "$pkg")
            if [ "$name" = "usrcp-imessage" ] || [ "$name" = "usrcp-hermes" ]; then
              continue
            fi
            if [ -f "$pkg/package.json" ]; then
              echo "::group::npm ci in $pkg"
              (cd "$pkg" && npm ci)
              echo "::endgroup::"
            fi
          done
      - name: Test ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: npm test

  node-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            packages/usrcp-imessage/package-lock.json
            packages/usrcp-local/package-lock.json
            packages/usrcp-stream/package-lock.json
      - name: Upgrade npm
        run: npm install -g npm@latest
      # usrcp-imessage's pretest now builds usrcp-local AND usrcp-stream
      # (PR #42 wired stream-mode into the adapters). Install all three.
      - name: Install deps
        run: |
          (cd packages/usrcp-local && npm ci)
          (cd packages/usrcp-stream && npm ci)
          (cd packages/usrcp-imessage && npm ci)
      - name: Test usrcp-imessage
        working-directory: packages/usrcp-imessage
        run: npm test

  # End-to-end install smoke. This is the test that would have caught
  # the v0.1.1 better-sqlite3 / Node 26 silent-broken-install bug at
  # PR time instead of after release. It simulates what a fresh-install
  # user does:
  #   1. `npm ci` (which triggers postinstall → npm rebuild better-sqlite3)
  #   2. `npm run build`
  #   3. `npm link` (puts `usrcp` on PATH)
  #   4. `usrcp --help` — banner renders, binary loads
  #   5. `usrcp init --dev` — full ledger init exercising better-sqlite3
  #      end-to-end
  # If any step fails (e.g. better-sqlite3 won't load on this Node),
  # the smoke job fails. No silent broken installs reach a tag.
  install-smoke:
    name: install-smoke (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: packages/usrcp-local/package-lock.json
      - name: Upgrade npm
        run: npm install -g npm@latest
      - name: npm ci (triggers postinstall rebuild)
        working-directory: packages/usrcp-local
        run: npm ci
      - name: Verify bindings file present
        working-directory: packages/usrcp-local
        run: |
          if [ ! -f node_modules/better-sqlite3/build/Release/better_sqlite3.node ]; then
            echo "::error::better_sqlite3.node missing — postinstall rebuild did not produce a binary"
            ls -la node_modules/better-sqlite3/build/ || true
            exit 1
          fi
          echo "✓ bindings file present"
      - name: Verify better-sqlite3 loads + opens an in-memory DB
        working-directory: packages/usrcp-local
        run: |
          node -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.prepare('SELECT 1 as x').get(); console.log('✓ better-sqlite3', require('better-sqlite3/package.json').version, 'loads on Node', process.version)"
      - name: Build
        working-directory: packages/usrcp-local
        run: npm run build
      - name: Link binary
        working-directory: packages/usrcp-local
        run: npm link
      - name: usrcp --help
        run: usrcp --help
      - name: usrcp init --dev in isolated HOME
        run: |
          export HOME=$(mktemp -d "${RUNNER_TEMP:-/tmp}/usrcp-smoke-XXXXXX")
          echo "Using isolated HOME=$HOME"
          usrcp init --dev
          usrcp status
          echo "✓ init + status succeeded"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install hermes (with dev extras)
        working-directory: packages/usrcp-hermes
        run: pip install -e '.[dev]'
      - name: Test usrcp-hermes
        working-directory: packages/usrcp-hermes
        run: pytest
